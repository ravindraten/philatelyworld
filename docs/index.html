<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Philately World</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <div class="header-top-bar">
        <span>Global Shipping Available</span>
        <span>•</span>
        <span>Expertly Authenticated</span>
    </div>
    <div class="header-main">
        <div class="logo-wrapper">
            <img src="images/logo.jpg" alt="Logo" class="logo">
        </div>
        <div class="brand-info">
            <h1>Philately World</h1>
            <p>ESTABLISHED 2017 • PREMIUM STAMP CURATION</p>
        </div>
        <div class="header-actions">
            <a href="https://wa.me/31633467712" class="contact-pill">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                    <path d="M13.601 2.326A7.854 7.854 0 0 0 7.994 0C3.627 0 .068 3.558.064 7.926c0 1.399.366 2.76 1.06 3.973L0 16l4.104-1.076a7.858 7.858 0 0 0 3.888 1.029h.001c4.367 0 7.926-3.559 7.93-7.93a7.856 7.856 0 0 0-2.322-5.697zM7.994 14.52a6.525 6.525 0 0 1-3.333-.915l-.239-.142-2.471.648.66-2.409-.156-.248a6.503 6.503 0 0 1-1.003-3.528c.003-3.593 2.932-6.52 6.528-6.52a6.516 6.516 0 0 1 4.611 1.913 6.516 6.516 0 0 1 1.915 4.617c-.003 3.593-2.931 6.52-6.527 6.52z"/>
                </svg>
                Chat with Me
            </a>
        
            <a href="https://www.instagram.com/philatelyworld10" target="_blank" class="social-icon">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <defs>
                        <linearGradient id="insta-gradient" x1="0%" y1="100%" x2="100%" y2="0%">
                            <stop offset="0%" style="stop-color:#f09433;stop-opacity:1" />
                            <stop offset="25%" style="stop-color:#e6683c;stop-opacity:1" />
                            <stop offset="50%" style="stop-color:#dc2743;stop-opacity:1" />
                            <stop offset="75%" style="stop-color:#cc2366;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#bc1888;stop-opacity:1" />
                        </linearGradient>
                    </defs>
                    <rect x="2" y="2" width="20" height="20" rx="5" ry="5" stroke="url(#insta-gradient)"></rect>
                    <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z" stroke="url(#insta-gradient)"></path>
                    <line x1="17.5" y1="6.5" x2="17.51" y2="6.5" stroke="url(#insta-gradient)"></line>
                </svg>
            </a>
            <div class="currency-nav">
                <button onclick="setCurrency('INR')" id="btnINR" class="curr-btn active">₹ INR</button>
                <button onclick="setCurrency('EUR')" id="btnEUR" class="curr-btn">€ EUR</button>
            </div>
        </div>
    </div>
    <div class="search-container">
        <input type="text" id="stampSearch" onkeyup="filterStamps()" placeholder="Search by theme, country, or year...">
    </div>
    <p id="lastUpdated" class="header-status"></p>
</header>

<div class="container">
    <div class="stamp-grid" id="stampGrid"></div>
</div>

<div id="myModal" class="modal">
    <span class="close" onclick="closeModal()">&times;</span>
    <a class="prev" onclick="changeSlide(-1)">&#10094;</a>
    <img class="modal-content" id="img01">
    <a class="next" onclick="changeSlide(1)">&#10095;</a>
    <div id="caption"></div>
</div>
<footer style="text-align: center; padding: 40px 20px; color: var(--text-light); border-top: 1px solid #f1f5f9; margin-top: 50px;">
    <p style="font-size: 0.85rem; margin-bottom: 5px;">&copy; 2026 Philatelic Elite Gallery</p>
    <!-- <p id="lastUpdated" style="font-size: 0.75rem; font-weight: 500; text-transform: uppercase; letter-spacing: 1px;"></p> -->
</footer>
<script src="data.js"></script>

<script src="script.js"></script>

</body>
</html>
