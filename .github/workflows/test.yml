name: Pre-Merge Web Tests
on: [pull_request, push]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip' # caching pip dependencies

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Start Local Server
        # Starts the server on port 5500 in the background
        # Note: python -m http.server serves the CURRENT directory
        run: python -m http.server 5500 & 

      - name: Wait for server
        run: |
          for i in {1..10}; do
            if curl --silent --fail http://localhost:5500/docs/index.html; then
              echo "Server is up!"
              break
            fi
            echo "Waiting for server..."
            sleep 2
          done

      - name: Run Selenium Tests (Parallel)
        run: |
          # Generate the HTML report (can still be downloaded)
          pytest -n auto --html=report.html --self-contained-html --color=no > test-output.txt || true
          
          # Print the output to the console for the logs
          cat test-output.txt
          
          # Append the readable results directly to the GitHub Job Summary
          echo "## Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`text" >> $GITHUB_STEP_SUMMARY
          cat test-output.txt >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          
          # Re-run pytest silently just to capture the correct exit code for the action status
          pytest -n auto -q docs/test_philately.py

      - name: Upload Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-html
          path: report.html
