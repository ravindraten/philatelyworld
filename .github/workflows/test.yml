name: Run Python Tests
on: [pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: |
          pip install pytest selenium webdriver-manager
      - name: Run Tests
        run: |
          # You would need a step here to start a local server
          # or point the URL in the test to a staging site.
          pytest test_philately.py