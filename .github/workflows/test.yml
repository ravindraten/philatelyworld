name: Pre-Merge Web Tests
on: [pull_request, push]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip' # caching pip dependencies

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Start Local Server
        # Starts the server on port 5500 in the background
        # Note: python -m http.server serves the CURRENT directory
        run: python -m http.server 5500 & 

      - name: Wait for server
        run: |
          for i in {1..10}; do
            if curl --silent --fail http://localhost:5500/docs/index.html; then
              echo "Server is up!"
              break
            fi
            echo "Waiting for server..."
            sleep 2
          done

      - name: Run Selenium Tests (Parallel)
        run: |
          pytest -n auto docs/test_philately.py
